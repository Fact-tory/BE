# ===================================================================
# 서버 기본 설정
# ===================================================================
server:
  port: ${SERVER_PORT}

# ===================================================================
# JWT 토큰 보안 설정
# ===================================================================
jwt-secret-key: ${JWT_SECRET_KEY}
jwt:
  access-token:
    expiration: 3600
  refresh-token:
    expiration: 1209600

# ===================================================================
# 관리자 시스템 설정
# ===================================================================
admin:
  master-token: ${ADMIN_MASTER_TOKEN}
  token:
    identifier: ${ADMIN_TOKEN_IDENTIFIER}
  session:
    expiration: 3600
    max-concurrent: 1

# ===================================================================
# 개인정보 암호화 설정
# ===================================================================
encryption:
  field:
    secret-key: ${ENCRYPTION_SECRET_KEY}

# ===================================================================
# 네이버 뉴스 API 설정
# ===================================================================
naver:
  api:
    client-id: ${NAVER_API_CLIENT_ID}
    client-secret: ${NAVER_API_CLIENT_SECRET}
    daily-limit: 25000

# ===================================================================
# OpenSearch 검색 엔진 설정
# ===================================================================
opensearch:
  host: ${OPENSEARCH_HOST}
  port: ${OPENSEARCH_PORT}
  scheme: ${OPENSEARCH_SCHEME}
  username: ${OPENSEARCH_USERNAME}
  password: ${OPENSEARCH_PASSWORD}
  connection:
    timeout: 5000
    socket-timeout: 30000
    max-connections: 50
    max-connections-per-route: 10
  indexing:
    batch-size: 100
    flush-interval: 30s
    refresh-interval: 30s
  search:
    default-size: 10
    max-size: 100
    timeout: 10s
  monitoring:
    enabled: true
    slow-query-threshold: 1000ms

# ===================================================================
# Redis 캐시 만료시간 설정
# ===================================================================
redis:
  expiration:
    refresh-token: 1209600
    kakao-tid: 180
    user-session: 3600
    verification-code: 300

# ===================================================================
# 애플리케이션 동작 관련 설정
# ===================================================================
app:
  # 프론트엔드 연동 설정
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
    success-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/success
    failure-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/error
  # 스케줄러 및 배치 작업 커스텀 설정 (개발 환경에서는 비활성화)
  scheduler:
    enabled: false
  batch:
    naver-crawling:
      enabled: true
      max-articles-per-office: 30
      crawling-interval-seconds: 2
      retry-attempts: 3
      timeout-minutes: 5

# ===================================================================
# Spring Boot 핵심 설정
# ===================================================================
spring:
  # 데이터베이스 연결 설정
  datasource:
    url: jdbc:mysql://${DB_URL}/factory
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 데이터 소스 설정 (Redis, MongoDB)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 3000ms
      repositories:
        enabled: false
    mongodb:
      uri: ${MONGODB_URI}
      repositories:
        enabled: true

  # RabbitMQ 메시지 큐 연결 설정
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    connection-timeout: 30s
    requested-heartbeat: 30s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0

  # JPA & Hibernate 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true
        connection.CharSet: utf8mb4
        connection.characterEncoding: utf-8
        connection.useUnicode: true

  # OAuth2 Client 설정 (실제 개발/배포용)
  # 설정 방법: docs/OAuth2_SETUP_GUIDE.md 참고
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID} # Google Cloud Console에서 발급받은 클라이언트 ID
            client-secret: ${GOOGLE_CLIENT_SECRET} # Google Cloud Console에서 발급받은 클라이언트 보안 비밀번호
            scope: [ email, profile ]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID} # Kakao Developers에서 발급받은 REST API 키
            client-secret: ${KAKAO_CLIENT_SECRET} # Kakao Developers에서 발급받은 Client Secret (선택)
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [ profile_nickname, account_email ]
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 기타 Spring 설정
  sql:
    init:
      encoding: UTF-8
  thymeleaf:
    check-template-location: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# ===================================================================
# 로깅 레벨 설정
# ===================================================================
logging:
  level:
    # 라이브러리 로그 레벨
    org.springframework.data.repository.config: ERROR
    org.springframework.data.repository.support: ERROR
    org.hibernate: WARN
    org.hibernate.jpa.internal.util.LogHelper: ERROR
    org.hibernate.Version: ERROR
    org.hibernate.orm.connections.pooling: ERROR
    org.hibernate.engine.transaction.jta.platform: ERROR
    io.netty.resolver.dns: ERROR
    org.mongodb.driver: WARN
    com.zaxxer.hikari: WARN
    org.opensearch: INFO
    # 애플리케이션 로그 레벨
    org.opensearch.search.query: DEBUG
    com.commonground.be.domain.news.service.OpenSearchIndexingService: DEBUG